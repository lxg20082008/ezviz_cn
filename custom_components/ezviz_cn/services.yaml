set_alarm_detection_sensibility:
  target:
    entity:
      integration: ezviz_cn
      domain: camera
  fields:
    level:
      required: true
      example: 3
      default: 3
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    type_value:
      required: true
      example: "0"
      default: "0"
      selector:
        select:
          options:
            - "0"
            - "3"

wake_device:
  target:
    entity:
      integration: ezviz_cn
      domain: camera

ptz_go_coordinates:
  name: 云台转到指定坐标
  description: 将云台转到广角画面中的指定归一化坐标(0-1 左上原点), 用于常用位置快捷定位。
  target:
    entity:
      integration: ezviz_cn
      domain: camera
  fields:
    x_axis:
      required: true
      example: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: box
    y_axis:
      required: true
      example: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: box
